<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cây Ngữ Pháp Tiếng Anh - Premium EdTech UI</title>

    <!-- Import Google Font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      /* ================================================================
   ENGLISH GRAMMAR ACADEMY
   PREMIUM EDTECH UI
   Version 2.0
================================================================ */

      /* =========================
   DESIGN TOKENS
========================= */
      :root {
        --bg: #f4f6fa;
        --surface: #ffffff;
        --surface-soft: #f8faff;
        --surface-muted: #f1f4f9;

        --ink: #101828;
        --ink-2: #344054;
        --ink-3: #475467;
        --muted: #667085;
        --muted-2: #98a2b3;

        --line: #e4e7ec;
        --line-soft: #eef1f5;

        --brand: #3157d5;
        --brand-dark: #2447b8;
        --brand-light: #eef2ff;
        --brand-border: #dbe3ff;

        --success: #067647;
        --success-bg: #ecfdf3;
        --success-border: #abefc6;

        --danger: #b42318;
        --danger-bg: #fef3f2;
        --danger-border: #fecdca;

        --warning: #9b6a18;
        --warning-bg: #fffaeb;
        --warning-border: #fedf89;

        --radius-xs: 8px;
        --radius-sm: 10px;
        --radius-md: 14px;
        --radius-lg: 18px;
        --radius-xl: 24px;
        --radius-2xl: 28px;

        --shadow-xs: 0 1px 2px rgba(16, 24, 40, 0.03);

        --shadow-sm:
          0 2px 6px rgba(16, 24, 40, 0.04), 0 8px 20px rgba(16, 24, 40, 0.035);

        --shadow-md:
          0 8px 24px rgba(16, 24, 40, 0.06), 0 20px 50px rgba(16, 24, 40, 0.04);

        --shadow-brand: 0 8px 22px rgba(49, 87, 213, 0.2);

        --sidebar-width: 330px;
        --content-max: 1180px;

        --transition-fast: 160ms ease;
        --transition: 220ms ease;
      }

      /* =========================
   RESET
========================= */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html {
        width: 100%;
        height: 100%;
        scroll-behavior: smooth;
      }

      body {
        width: 100%;
        height: 100%;
        min-height: 100vh;

        display: flex;
        flex-direction: row;

        overflow: hidden;

        color: var(--ink);
        background: var(--bg);

        font-family:
          "Poppins",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;

        font-size: 14px;
        line-height: 1.5;
        letter-spacing: -0.012em;

        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      button,
      input,
      textarea,
      select {
        font: inherit;
      }

      button {
        -webkit-tap-highlight-color: transparent;
      }

      ::selection {
        background: rgba(49, 87, 213, 0.16);
        color: var(--ink);
      }

      /* =========================
   SCROLLBAR
========================= */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }

      ::-webkit-scrollbar-track {
        background: transparent;
      }

      ::-webkit-scrollbar-thumb {
        background: #d4dae5;
        border-radius: 999px;
        border: 2px solid transparent;
        background-clip: padding-box;
      }

      ::-webkit-scrollbar-thumb:hover {
        background: #b7c0d0;
        border: 2px solid transparent;
        background-clip: padding-box;
      }

      * {
        scrollbar-width: thin;
        scrollbar-color: #d4dae5 transparent;
      }

      /* =========================
   PAGE BACKGROUND
========================= */
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: -2;
        pointer-events: none;

        background:
          radial-gradient(
            circle at 85% 10%,
            rgba(49, 87, 213, 0.07),
            transparent 28%
          ),
          radial-gradient(
            circle at 15% 90%,
            rgba(49, 87, 213, 0.04),
            transparent 25%
          );
      }

      body::after {
        content: "";
        position: fixed;
        inset: 0;
        z-index: -1;
        pointer-events: none;

        background-image:
          linear-gradient(rgba(16, 24, 40, 0.018) 1px, transparent 1px),
          linear-gradient(90deg, rgba(16, 24, 40, 0.018) 1px, transparent 1px);

        background-size: 40px 40px;

        mask-image: linear-gradient(
          to bottom,
          rgba(0, 0, 0, 0.45),
          transparent 70%
        );
      }

      /* ================================================================
   SIDEBAR
================================================================ */
      .sidebar {
        position: relative;
        z-index: 20;

        width: var(--sidebar-width);
        min-width: var(--sidebar-width);
        height: 100%;

        display: flex;
        flex-direction: column;

        background: rgba(255, 255, 255, 0.94);

        border-right: 1px solid var(--line);

        box-shadow: 10px 0 35px rgba(16, 24, 40, 0.035);

        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
      }

      /* =========================
   SIDEBAR HEADER
========================= */
      .sidebar-header {
        position: relative;
        overflow: hidden;

        min-height: 104px;

        display: flex;
        flex-direction: column;
        justify-content: center;

        padding: 24px 25px;

        color: #ffffff;

        background:
          radial-gradient(
            circle at 90% 10%,
            rgba(255, 255, 255, 0.18),
            transparent 28%
          ),
          linear-gradient(145deg, #101a3a 0%, #17275b 48%, #3157d5 100%);

        font-size: 12px;
        font-weight: 700;
        line-height: 1.3;

        letter-spacing: 0.13em;
        text-transform: uppercase;
      }

      .sidebar-header::before {
        content: "";

        position: absolute;
        width: 130px;
        height: 130px;

        right: -50px;
        top: -55px;

        border-radius: 50%;

        background: rgba(255, 255, 255, 0.08);
      }

      .sidebar-header::after {
        content: "GRAMMAR ACADEMY";

        display: block;

        margin-top: 8px;

        color: rgba(255, 255, 255, 0.58);

        font-size: 9px;
        font-weight: 500;

        letter-spacing: 0.25em;
      }

      /* =========================
   LANGUAGE SWITCHER
========================= */
      .language-switcher {
        padding: 15px 16px;

        background: rgba(248, 250, 252, 0.82);

        border-bottom: 1px solid var(--line);
      }

      .language-switch {
        display: flex;
        gap: 3px;

        padding: 4px;

        background: #edf0f5;

        border: 1px solid #e3e7ee;
        border-radius: 12px;
      }

      .language-btn {
        flex: 1;

        min-height: 36px;

        border: 0;
        border-radius: 9px;

        background: transparent;

        color: var(--muted);

        font-size: 12px;
        font-weight: 500;

        cursor: pointer;

        transition:
          background var(--transition),
          color var(--transition),
          box-shadow var(--transition),
          transform var(--transition-fast);
      }

      .language-btn:hover {
        color: var(--brand);
      }

      .language-btn:active {
        transform: scale(0.98);
      }

      .language-btn.active {
        color: var(--brand);

        background: #ffffff;

        font-weight: 600;

        box-shadow:
          0 1px 3px rgba(16, 24, 40, 0.07),
          0 3px 8px rgba(16, 24, 40, 0.04);
      }

      /* ================================================================
   TREE
================================================================ */
      .tree-container {
        flex: 1;
        min-height: 0;

        overflow-y: auto;

        padding: 16px 12px 30px;
      }

      .tree-container ul {
        list-style: none;
      }

      .tree-node {
        margin: 2px 0;
      }

      .node-content {
        display: flex;
        align-items: center;
        gap: 3px;

        min-width: 0;
      }

      /* =========================
   TREE CHILDREN
========================= */
      .tree-container .children-list {
        display: none;

        margin: 3px 0 4px 15px;
        padding-left: 10px;

        border-left: 1px solid #e2e6ed;

        animation: treeOpen 180ms ease;
      }

      .tree-node.open > .children-list {
        display: block;
      }

      /* =========================
   EXPAND BUTTON
========================= */
      .expand-btn {
        flex: 0 0 28px;

        width: 28px;
        height: 28px;

        display: flex;
        align-items: center;
        justify-content: center;

        border: 0;
        border-radius: 8px;

        background: transparent;

        color: #98a2b3;

        font-size: 10px;

        cursor: pointer;

        transition:
          background var(--transition-fast),
          color var(--transition-fast);
      }

      .expand-btn:hover {
        color: var(--brand);
        background: var(--brand-light);
      }

      .expand-btn.no-children {
        color: #cdd3dd;
        cursor: default;
      }

      .expand-icon {
        display: block;

        transition:
          transform var(--transition),
          color var(--transition);
      }

      .tree-node.open > .node-content .expand-icon {
        transform: rotate(90deg);
      }

      /* =========================
   CATEGORY
========================= */
      .category-title {
        position: relative;

        flex: 1;
        min-width: 0;

        padding: 8px 10px;

        border: 1px solid transparent;
        border-radius: 9px;

        color: var(--ink-3);

        font-size: 12.5px;
        font-weight: 500;

        line-height: 1.45;

        cursor: pointer;

        transition:
          background var(--transition-fast),
          color var(--transition-fast),
          border-color var(--transition-fast);
      }

      .category-title:hover {
        color: var(--ink);

        background: #f5f7fa;

        border-color: #edf0f4;
      }

      .category-title.active {
        color: var(--brand);

        background: linear-gradient(90deg, #eef2ff, #f5f7ff);

        border-color: var(--brand-border);

        font-weight: 600;
      }

      .category-title.active::before {
        content: "";

        position: absolute;

        left: -1px;
        top: 7px;
        bottom: 7px;

        width: 3px;

        border-radius: 0 4px 4px 0;

        background: var(--brand);
      }

      /* ================================================================
   MAIN CONTENT
================================================================ */
      .main-content {
        flex: 1 1 auto;
        min-width: 0;
        min-height: 0;
        height: 100%;

        overflow-y: auto;
        overflow-x: hidden;

        padding: 32px clamp(20px, 4vw, 64px) 80px;

        display: flex;
        flex-direction: column;
        align-items: stretch;

        gap: 20px;
      }

      /* ================================================================
   CARD
================================================================ */
      .card {
        width: 100%;
        max-width: var(--content-max);
        margin: 0 auto;

        background: rgba(255, 255, 255, 0.96);

        border: 1px solid rgba(224, 228, 236, 0.95);

        border-radius: var(--radius-xl);

        padding: clamp(22px, 3vw, 34px);

        box-shadow: var(--shadow-sm);

        animation: slideUp 320ms ease-out;

        transition:
          border-color var(--transition),
          box-shadow var(--transition);
      }

      .card:hover {
        border-color: #dce1e9;
        box-shadow: var(--shadow-md);
      }

      /* =========================
   HERO CARD
========================= */
      .main-content > .card:first-child {
        position: relative;
        overflow: hidden;

        background:
          radial-gradient(
            circle at 100% 0%,
            rgba(49, 87, 213, 0.09),
            transparent 30%
          ),
          linear-gradient(135deg, #ffffff 0%, #fbfcff 55%, #f4f6ff 100%);
      }

      .main-content > .card:first-child::after {
        content: "";

        position: absolute;

        width: 180px;
        height: 180px;

        right: -90px;
        bottom: -90px;

        border-radius: 50%;

        background: rgba(49, 87, 213, 0.045);

        pointer-events: none;
      }

      /* ================================================================
   TYPOGRAPHY
================================================================ */
      h1 {
        margin: 0 0 10px;

        color: var(--ink);

        font-size: clamp(1.45rem, 2.7vw, 2rem);

        font-weight: 700;

        line-height: 1.25;

        letter-spacing: -0.035em;
      }

      .description {
        max-width: 760px;

        color: var(--muted);

        font-size: 14px;

        line-height: 1.75;
      }

      /* ================================================================
   BREADCRUMB
================================================================ */
      .breadcrumb {
        width: 100%;

        display: flex;
        align-items: center;

        min-width: 0;

        margin-bottom: 25px;
        padding-bottom: 14px;

        border-bottom: 1px solid var(--line-soft);

        overflow-x: auto;
        overflow-y: hidden;

        white-space: nowrap;

        scrollbar-width: none;

        color: var(--muted);

        font-size: 11px;

        gap: 4px;
      }

      .breadcrumb::-webkit-scrollbar {
        display: none;
      }

      .breadcrumb-item {
        flex: 0 0 auto;

        display: inline-flex;
        align-items: center;

        max-width: 300px;

        overflow: hidden;
        text-overflow: ellipsis;

        padding: 5px 8px;

        border-radius: 7px;

        color: var(--muted);

        font-weight: 600;

        cursor: pointer;

        transition:
          background var(--transition-fast),
          color var(--transition-fast);
      }

      .breadcrumb-item:hover {
        color: var(--brand);
        background: #f4f6fb;
      }

      .breadcrumb-item.active {
        color: var(--brand);
        background: var(--brand-light);

        cursor: default;
      }

      .breadcrumb-separator {
        flex: 0 0 auto;

        color: #b7becb;

        font-size: 9px;

        user-select: none;
      }

      /* ================================================================
   THEORY HEADER
================================================================ */
      .theory-title {
        display: flex;
        align-items: center;
        justify-content: space-between;

        gap: 16px;

        margin-bottom: 20px;
      }

      .theory-title h1 {
        margin-bottom: 0;
      }

      /* =========================
   THEORY BADGE
========================= */
      .theory-badge {
        flex: 0 0 auto;

        display: inline-flex;
        align-items: center;
        gap: 5px;

        padding: 6px 11px;

        border: 1px solid var(--warning-border);
        border-radius: 999px;

        background: var(--warning-bg);

        color: var(--warning);

        font-size: 10px;
        font-weight: 700;

        letter-spacing: 0.05em;
        text-transform: uppercase;
      }

      /* ================================================================
   THEORY CONTENT
================================================================ */
      .theory-content {
        position: relative;

        padding: 20px 22px 20px 23px;

        background: linear-gradient(135deg, #f8faff, #f6f8fd);

        border: 1px solid #e5e9f1;
        border-radius: var(--radius-md);

        color: var(--ink-2);

        font-size: 13.5px;

        line-height: 1.85;

        white-space: pre-line;

        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.7);
      }

      .theory-content::before {
        content: "";

        position: absolute;

        left: 0;
        top: 15px;
        bottom: 15px;

        width: 4px;

        border-radius: 0 5px 5px 0;

        background: linear-gradient(to bottom, var(--brand), #6882e8);
      }

      /* ================================================================
   QUIZ SECTION
================================================================ */
      .quiz-section {
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      /* =========================
   QUIZ HEADER
========================= */
      .quiz-header {
        display: flex;
        align-items: center;
        justify-content: space-between;

        gap: 15px;

        padding-bottom: 16px;

        border-bottom: 1px solid var(--line);
      }

      .quiz-title {
        color: var(--ink);

        font-size: 16px;
        font-weight: 700;

        letter-spacing: -0.025em;
      }

      .quiz-count {
        flex: 0 0 auto;

        padding: 5px 10px;

        border: 1px solid var(--brand-border);
        border-radius: 999px;

        background: var(--brand-light);

        color: var(--brand);

        font-size: 10px;
        font-weight: 700;

        white-space: nowrap;
      }

      /* ================================================================
   EXAM SELECTOR
================================================================ */
      .exam-selector {
        width: 100%;

        display: grid;

        grid-template-columns: auto minmax(0, 1fr) auto;

        align-items: center;

        gap: 8px;

        padding: 6px;

        background: var(--surface-muted);

        border: 1px solid var(--line);

        border-radius: var(--radius-md);
      }

      /* =========================
   EXAM NAV
========================= */
      .exam-nav-btn {
        flex: 0 0 auto;

        min-height: 36px;

        padding: 0 12px;

        border: 1px solid var(--line);

        border-radius: 9px;

        background: #ffffff;

        color: var(--ink-2);

        font-size: 11px;
        font-weight: 600;

        cursor: pointer;

        white-space: nowrap;

        box-shadow: var(--shadow-xs);

        transition:
          color var(--transition-fast),
          border-color var(--transition-fast),
          background var(--transition-fast),
          transform var(--transition-fast),
          box-shadow var(--transition-fast);
      }

      .exam-nav-btn:hover:not(:disabled) {
        color: var(--brand);

        border-color: #cbd6fa;

        background: #fbfcff;

        box-shadow: var(--shadow-sm);

        transform: translateY(-1px);
      }

      .exam-nav-btn:active:not(:disabled) {
        transform: translateY(0);
      }

      .exam-nav-btn:disabled {
        opacity: 0.42;
        cursor: not-allowed;
      }

      /* =========================
   EXAM LIST
========================= */
      .exam-list {
        min-width: 0;

        display: flex;
        align-items: center;

        gap: 5px;

        overflow-x: auto;

        scrollbar-width: none;

        padding: 2px;
      }

      .exam-list::-webkit-scrollbar {
        display: none;
      }

      /* =========================
   EXAM TAB
========================= */
      .exam-tab {
        flex: 0 0 auto;

        min-height: 34px;

        padding: 0 13px;

        border: 1px solid transparent;

        border-radius: 8px;

        background: transparent;

        color: var(--muted);

        font-size: 11px;
        font-weight: 600;

        cursor: pointer;

        white-space: nowrap;

        transition:
          background var(--transition-fast),
          color var(--transition-fast),
          border-color var(--transition-fast),
          box-shadow var(--transition-fast);
      }

      .exam-tab:hover {
        color: var(--brand);
        background: #e9edff;
      }

      .exam-tab.active {
        color: var(--brand);

        background: #ffffff;

        border-color: #e0e5f2;

        box-shadow:
          0 1px 3px rgba(16, 24, 40, 0.06),
          0 3px 8px rgba(16, 24, 40, 0.035);
      }

      /* ================================================================
   ACTIVE EXAM
================================================================ */
      .quiz-section > .quiz-header[style] {
        margin-top: 2px;

        padding: 4px 0 12px !important;

        border-bottom: 1px solid var(--line) !important;
      }

      .quiz-section > .quiz-header[style] .quiz-title {
        color: var(--brand) !important;

        font-size: 15px;
      }

      .quiz-section > .quiz-header[style] .quiz-count {
        background: var(--brand-light) !important;
      }

      /* ================================================================
   QUESTION
================================================================ */
      .question-box {
        position: relative;

        padding: 22px;

        background: #ffffff;

        border: 1px solid var(--line);

        border-radius: var(--radius-lg);

        box-shadow: var(--shadow-xs);

        transition:
          border-color var(--transition),
          box-shadow var(--transition),
          transform var(--transition);
      }

      .question-box:hover {
        border-color: #d5dbea;

        box-shadow: var(--shadow-sm);

        transform: translateY(-1px);
      }

      /* =========================
   QUESTION NUMBER
========================= */
      .question-number {
        display: inline-flex;
        align-items: center;

        margin-bottom: 13px;

        padding: 5px 9px;

        border: 1px solid #e4e7ec;

        border-radius: 999px;

        background: #f8f9fb;

        color: var(--muted);

        font-size: 10px;
        font-weight: 700;

        letter-spacing: 0.02em;
      }

      /* =========================
   QUESTION TITLE
========================= */
      .question-title {
        margin-bottom: 18px;

        color: var(--ink);

        font-size: 14px;
        font-weight: 600;

        line-height: 1.7;
      }

      /* ================================================================
   OPTIONS
================================================================ */
      .options-list {
        display: flex;
        flex-direction: column;

        gap: 8px;
      }

      .option-label {
        position: relative;

        display: flex;
        align-items: center;

        min-height: 50px;

        gap: 12px;

        padding: 12px 14px;

        border: 1px solid #e1e5ec;

        border-radius: 11px;

        background: #ffffff;

        color: var(--ink-2);

        font-size: 13px;

        cursor: pointer;

        transition:
          background var(--transition-fast),
          border-color var(--transition-fast),
          box-shadow var(--transition-fast),
          transform var(--transition-fast);
      }

      .option-label:hover {
        background: #fafbff;

        border-color: #bcc8ee;

        box-shadow: 0 3px 10px rgba(49, 87, 213, 0.05);

        transform: translateX(2px);
      }

      /* =========================
   RADIO
========================= */
      .option-label input[type="radio"] {
        flex: 0 0 auto;

        width: 17px;
        height: 17px;

        margin: 0;

        accent-color: var(--brand);

        cursor: pointer;
      }

      .option-label span {
        flex: 1;

        line-height: 1.5;
      }

      /* ================================================================
   BUTTONS (SUBMIT / RESET / CHECK ALL)
================================================================ */
      .submit-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;

        min-height: 42px;

        margin-top: 18px;

        padding: 0 18px;

        border: 0;
        border-radius: 10px;

        background: linear-gradient(
          135deg,
          #294bbd 0%,
          #3157d5 55%,
          #4b6fe1 100%
        );

        color: #ffffff;

        font-size: 12px;
        font-weight: 700;

        cursor: pointer;

        box-shadow: var(--shadow-brand);

        transition:
          transform var(--transition),
          box-shadow var(--transition),
          filter var(--transition);
      }

      .submit-btn:hover {
        filter: brightness(1.03);

        transform: translateY(-2px);

        box-shadow: 0 10px 25px rgba(49, 87, 213, 0.28);
      }

      .submit-btn:active {
        transform: translateY(0);

        box-shadow: 0 5px 14px rgba(49, 87, 213, 0.2);
      }

      .exam-actions {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 12px;
        margin-top: 15px;
        padding-top: 20px;
        border-top: 1px solid var(--line);
      }

      .reset-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 42px;
        padding: 0 18px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: #ffffff;
        color: var(--ink-2);
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;

        transition: all var(--transition-fast);
      }

        border-color: #e4e7ec;
      }

      .check-all-btn {
        margin-top: 0; /* Ghi đè margin-top của submit-btn */

================================================================ */
      .result-alert {
        display: flex;
        flex-direction: column;

        gap: 7px;

        margin-top: 15px;

        padding: 15px 16px;

        border-radius: 12px;

        font-size: 12.5px;

        line-height: 1.65;

        animation: fadeIn 220ms ease;
      }

      .result-alert strong {
        font-weight: 700;
      }

      .correct-box {
        color: var(--success);

        background: var(--success-bg);

        border: 1px solid var(--success-border);
      }

      .incorrect-box {
        color: var(--danger);

        background: var(--danger-bg);

        border: 1px solid var(--danger-border);
      }

      .expl {
        color: inherit;

        opacity: 0.92;
      }

      /* ================================================================
   EMPTY STATE
================================================================ */
      .empty-state {
        width: 100%;

        display: flex;
        align-items: center;
        justify-content: center;

        min-height: 90px;

        padding: 24px;

        border: 1px dashed #d6dce7;

        border-radius: var(--radius-md);

        background: linear-gradient(135deg, #fafbfc, #f7f9fc);

        color: var(--muted);

        font-size: 12px;

        line-height: 1.6;

        text-align: center;
      }

      /* ================================================================
   FOCUS STATES
================================================================ */
      button:focus-visible,
      .category-title:focus-visible,
      .option-label:focus-within {
        outline: 3px solid rgba(49, 87, 213, 0.16);
        outline-offset: 2px;
      }

      /* ================================================================
   ANIMATIONS
================================================================ */
      @keyframes slideUp {
        from {
          opacity: 0;
          transform: translateY(10px);
        }

        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(3px);
        }

        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes treeOpen {
        from {
          opacity: 0;
          transform: translateY(-3px);
        }

        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

================================================================ */
      @media (min-width: 1400px) {

        }

        if (!languageIndex.hasOwnProperty(language)) return;
        currentLanguage = language;
        document.documentElement.lang = language;

        renderStaticUI();
        updateLanguageButtons();
        renderTree();

        if (activeNodeId) {
          const node = findNodeById(grammarData, activeNodeId);
          if (node) renderNodeContent(node);

          const path = findNodePath(grammarData, node.id) || [];

          path.forEach((currentNode) => {
            selectNode(currentNode.id);
          });
        } else {
          renderWelcome();
        }
      }

      function findNodeById(nodes, id) {
        for (const node of nodes) {
          if (node.id === id) return node;
          if (Array.isArray(node.children)) {
            const found = findNodeById(node.children, id);
            if (found) return found;
          }
        }
        return null;
      }

      function findNodePath(nodes, id, path = []) {
        for (const node of nodes) {
          const currentPath = [...path, node];
          if (node.id === id) return currentPath;
          if (node.children?.length) {
            const result = findNodePath(node.children, id, currentPath);
            if (result) return result;
          }
        }
        return null;
      }

      function findQuizById(nodes, quizId) {
        for (const node of nodes) {
          if (Array.isArray(node.exams)) {
            for (const exam of node.exams) {
              if (!Array.isArray(exam.quizzes)) continue;
              const quiz = exam.quizzes.find((item) => item.id === quizId);
              if (quiz) return quiz;
            }
          }
          if (Array.isArray(node.children)) {
            const found = findQuizById(node.children, quizId);
            if (found) return found;
          }
        }
        return null;
      }

      function renderTree() {
        const treeRoot = document.getElementById("treeRoot");
        treeRoot.innerHTML = renderNodeList(grammarData);
      }

      function renderNodeList(nodes) {
        if (!nodes?.length) return "";
        return `<ul>${nodes.map((node) => renderNode(node)).join("")}</ul>`;
      }

      function renderNode(node) {
        const hasChildren =
          Array.isArray(node.children) && node.children.length > 0;
        return `
        <li class="tree-node" data-node-id="${node.id}">
          <div class="node-content">
            ${
              hasChildren
                ? `<button class="expand-btn" onclick="toggleNode(event, '${node.id}')"><span class="expand-icon">❯</span></button>`
                : `<button class="expand-btn no-children" disabled>•</button>`
            }
            <div class="category-title ${node.id === activeNodeId ? "active" : ""}" 
                 data-node-id="${node.id}" onclick="selectNode('${node.id}')">
              ${escapeHtml(getText(node.name))}
            </div>
          </div>
          ${hasChildren ? `<div class="children-list">${renderNodeList(node.children)}</div>` : ""}
        </li>
      `;
      }

      function toggleNode(event, nodeId) {
        event.stopPropagation();
        const node = document.querySelector(
          `.tree-node[data-node-id="${nodeId}"]`,
        );
        if (node) node.classList.toggle("open");
      }

      function selectNode(nodeId) {
        const node = findNodeById(grammarData, nodeId);
        if (!node) return;

        activeNodeId = nodeId;
        activeExamId = null;

        document
          .querySelectorAll(".category-title")
          .forEach((el) => el.classList.remove("active"));
        const activeElement = document.querySelector(
          `.category-title[data-node-id="${nodeId}"]`,
        );
        if (activeElement) activeElement.classList.add("active");

        if (node.children?.length) {
          const treeNode = document.querySelector(
            `.tree-node[data-node-id="${nodeId}"]`,
          );
          if (treeNode) {
            treeNode.classList.add("open");

            const childNodes = treeNode.querySelectorAll(".tree-node");
            childNodes.forEach((child) => child.classList.remove("open"));
          }
        }

        renderNodeContent(node);
      }

      function renderWelcome() {
        const mainContent = document.getElementById("mainContent");
        mainContent.innerHTML = `
        <div class="card">
          <h1>${escapeHtml(t("welcomeTitle"))}</h1>
          <p class="description">${escapeHtml(t("welcomeDescription"))}</p>
        </div>
      `;
      }

      function renderNodeContent(node) {
        const mainContent = document.getElementById("mainContent");
        const path = findNodePath(grammarData, node.id) || [];
        const breadcrumbHtml = path
          .map((item, index) => {
            const isLast = index === path.length - 1;
            const className = isLast
              ? "breadcrumb-item active"
              : "breadcrumb-item";
            const clickAction = isLast
              ? ""
              : `onclick="selectNode('${item.id}')"`;
            return `<span class="${className}" ${clickAction}>${escapeHtml(getText(item.name))}</span>`;
          })
          .join('<span class="breadcrumb-separator"> ❯ </span>');

        const exams = Array.isArray(node.exams) ? node.exams : [];
        if (exams.length > 0) {
          if (!exams.some((exam) => exam.id === activeExamId)) {
            activeExamId = exams[0].id;
          }
        } else {
          activeExamId = null;
        }

        mainContent.innerHTML = `
        <div class="card">
          <div class="breadcrumb">📍 ${breadcrumbHtml}</div>
          <div class="theory-title">
            <h1>${escapeHtml(getText(node.name))}</h1>
            <span class="theory-badge">📚 ${t("theory")}</span>
          </div>
          ${
            node.theory && node.theory.length > 0
              ? `<div class="theory-content">${escapeHtml(getText(node.theory))}</div>`
              : `<div class="empty-state">${t("noTheory")}</div>`
          }
        </div>

        <div class="card quiz-section">
          <div class="quiz-header">
            <div class="quiz-title">${t("examPractice")}</div>
            <div class="quiz-count">${exams.length} ${t("examCount")}</div>
          </div>
          ${renderExamSelector(exams)}
          ${renderActiveExam(exams)}
        </div>
      `;
      }

      function renderExamSelector(exams) {
        if (!Array.isArray(exams) || exams.length === 0) {
          return `<div class="empty-state">${t("noExam")}</div>`;
        }
        const activeIndex = exams.findIndex((exam) => exam.id === activeExamId);

        return `
        <div class="exam-selector">
          <button class="exam-nav-btn" onclick="changeExam(-1)" ${activeIndex <= 0 ? "disabled" : ""}>
            ${t("previousExam")}
          </button>
          <div class="exam-list">
            ${exams
              .map(
                (exam, index) => `
              <button class="exam-tab ${exam.id === activeExamId ? "active" : ""}" 
                      onclick="selectExam('${exam.id}')">
                ${escapeHtml(getText(exam.name) || `${currentLanguage === "vi" ? "Đề" : "Exam"} ${index + 1}`)}
              </button>
            `,
              )
              .join("")}
          </div>
          <button class="exam-nav-btn" onclick="changeExam(1)" ${activeIndex >= exams.length - 1 ? "disabled" : ""}>
            ${t("nextExam")}
          </button>
        </div>
      `;
      }

      function renderActiveExam(exams) {
        if (!Array.isArray(exams) || exams.length === 0) return "";
        const exam = exams.find((item) => item.id === activeExamId);
        if (!exam) return "";
        const quizzes = Array.isArray(exam.quizzes) ? exam.quizzes : [];

        return `
<div class="quiz-header exam-active-header">
  <div class="quiz-title exam-active-title">
    📝 ${escapeHtml(getText(exam.name))}
  </div>
  <div class="quiz-count">
    ${quizzes.length} ${t("questionCount")}
  </div>
</div>
        ${renderQuizzes(quizzes)}
      `;
      }

      function selectExam(examId) {
        const node = findNodeById(grammarData, activeNodeId);
        if (!node || !Array.isArray(node.exams)) return;
        activeExamId = examId;
        renderNodeContent(node);
      }

      function changeExam(direction) {
        const node = findNodeById(grammarData, activeNodeId);
        if (!node || !Array.isArray(node.exams)) return;
        const currentIndex = node.exams.findIndex(
          (exam) => exam.id === activeExamId,
        );
        if (currentIndex === -1) {
          activeExamId = node.exams[0]?.id || null;
          renderNodeContent(node);
          return;
        }
        const nextIndex = currentIndex + direction;
        if (nextIndex < 0 || nextIndex >= node.exams.length) return;
        activeExamId = node.exams[nextIndex].id;
        renderNodeContent(node);
      }

      // Lưu câu trả lời của người dùng
      function saveAnswer(quizId, optionIndex) {
        if (!userAnswers[quizId]) {
          userAnswers[quizId] = { selected: null, isChecked: false };
        }
        userAnswers[quizId].selected = optionIndex;
        userAnswers[quizId].isChecked = false; // Reset trạng thái kiểm tra nếu user chọn lại

        // Xóa khung kết quả cũ nếu đang hiển thị
        const resultMsg = document.getElementById(`result-${quizId}`);
        if (resultMsg) resultMsg.innerHTML = "";
      }

      function renderQuizzes(quizzes) {
        if (!Array.isArray(quizzes) || quizzes.length === 0) {
          return `<div class="empty-state">${t("noQuestion")}</div>`;
        }

        const quizzesHtml = quizzes
          .map((quiz, index) => {
            const state = userAnswers[quiz.id] || {
              selected: null,
              isChecked: false,
            };
            let resultHtml = "";

            // Nếu đã từng check, in ra kết quả cũ ngay lập tức
            if (state.isChecked && state.selected !== null) {
              const isCorrect = state.selected === quiz.answer;
              if (isCorrect) {
                resultHtml = `
                    <div class="result-alert correct-box">
                      <strong>${t("correct")}</strong>
                      <span class="expl"><strong>${t("explanation")}</strong> ${escapeHtml(getText(quiz.explanation))}</span>
                    </div>`;
              } else {
                resultHtml = `
                    <div class="result-alert incorrect-box">
                      <strong>${t("incorrect")}</strong>
                      <span class="expl"><strong>${t("explanation")}</strong> ${escapeHtml(getText(quiz.explanation))}</span>
                    </div>`;
              }
            }

            return `
        <div class="question-box" id="quiz-${escapeHtml(quiz.id)}">
          <div class="question-number">${t("question")} ${index + 1}</div>
          <div class="question-title">${escapeHtml(getText(quiz.question))}</div>
          <div class="options-list">
            ${quiz.options
              .map(
                (option, optionIndex) => `
              <label class="option-label">
                <input type="radio" name="quiz-${quiz.id}" value="${optionIndex}" 
                  onchange="saveAnswer('${quiz.id}', ${optionIndex})" 
                  ${state.selected === optionIndex ? "checked" : ""}>
                <span>${escapeHtml(option)}</span>
              </label>
            `,
              )
              .join("")}
          </div>
          <button class="submit-btn" onclick="checkAnswer('${quiz.id}')">${t("check")}</button>
          <div id="result-${quiz.id}">${resultHtml}</div>
        </div>
      `;
          })
          .join("");

        // Thêm nút Kiểm tra tổng và Làm lại cuối danh sách
        return (
          quizzesHtml +
          `
          <div class="exam-actions">
            <button class="reset-btn" onclick="resetExamAnswers()">${t("reset")}</button>
            <button class="submit-btn check-all-btn" onclick="checkAllExamAnswers()">${t("checkAll")}</button>
          </div>
        `
        );
      }

      function checkAnswer(quizId) {
        const quiz = findQuizById(grammarData, quizId);
        if (!quiz) return;

        const state = userAnswers[quizId] || {
          selected: null,
          isChecked: false,
        };
        const resultMsg = document.getElementById(`result-${quizId}`);

        if (state.selected === null) {
          resultMsg.innerHTML = `<div class="result-alert incorrect-box"><strong>${t("chooseAnswer")}</strong></div>`;
          return;
        }

        // Cập nhật trạng thái đã kiểm tra
        if (!userAnswers[quizId])
          userAnswers[quizId] = { selected: state.selected, isChecked: true };
        else userAnswers[quizId].isChecked = true;

        if (state.selected === quiz.answer) {
          resultMsg.innerHTML = `
          <div class="result-alert correct-box">
            <strong>${t("correct")}</strong>
            <span class="expl"><strong>${t("explanation")}</strong> ${escapeHtml(getText(quiz.explanation))}</span>
          </div>
        `;
        } else {
          resultMsg.innerHTML = `
          <div class="result-alert incorrect-box">
            <strong>${t("incorrect")}</strong>
            <span class="expl"><strong>${t("explanation")}</strong> ${escapeHtml(getText(quiz.explanation))}</span>
          </div>
        `;
        }
      }

      function checkAllExamAnswers() {
        const node = findNodeById(grammarData, activeNodeId);
        if (!node || !Array.isArray(node.exams)) return;
        const exam = node.exams.find((e) => e.id === activeExamId);
        if (!exam || !Array.isArray(exam.quizzes)) return;

        // Kích hoạt checkAnswer cho tất cả câu hỏi trong đề
        exam.quizzes.forEach((quiz) => {
          checkAnswer(quiz.id);
        });
      }

      function resetExamAnswers() {
        const node = findNodeById(grammarData, activeNodeId);
        if (!node || !Array.isArray(node.exams)) return;
        const exam = node.exams.find((e) => e.id === activeExamId);
        if (!exam || !Array.isArray(exam.quizzes)) return;

        // Xóa đáp án của các câu trong đề hiện tại
        exam.quizzes.forEach((quiz) => {
          if (userAnswers[quiz.id]) {
            userAnswers[quiz.id].selected = null;
            userAnswers[quiz.id].isChecked = false;
          }
        });

        // Render lại UI để xóa radio button và thông báo kết quả
        renderNodeContent(node);
      }

      function escapeHtml(value) {
        if (value === undefined || value === null) return "";
        return String(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      renderStaticUI();
      updateLanguageButtons();
      renderTree();
    </script>
  </body>
</html>
