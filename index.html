<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cây Ngữ Pháp Tiếng Anh - Premium EdTech UI</title>

    <!-- Import Google Font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      /* ================================================================
       PREMIUM EDTECH UI — ENGLISH GRAMMAR ACADEMY
       Đã được dọn dẹp, tối ưu hóa layout, xóa bỏ các khai báo trùng lặp
    ================================================================ */
      :root {
        --bg: #f5f7fb;
        --surface: #ffffff;
        --surface-2: #f8faff;
        --ink: #101828;
        --ink-2: #344054;
        --muted: #667085;
        --line: #e7eaf0;
        --brand: #3157d5;
        --brand-soft: #eef2ff;
        --success: #079455;
        --success-soft: #ecfdf3;
        --danger: #d92d20;
        --danger-soft: #fef3f2;

        --radius-xl: 24px;
        --radius-lg: 18px;
        --radius-md: 13px;

        --shadow-1:
          0 1px 2px rgba(16, 24, 40, 0.03), 0 8px 30px rgba(16, 24, 40, 0.04);
        --shadow-2: 0 12px 40px rgba(16, 24, 40, 0.08);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: "Poppins", sans-serif;
        -webkit-tap-highlight-color: transparent;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
      }

      body {
        color: var(--ink);
        display: flex;
        flex-direction: row;
        letter-spacing: -0.01em;
      }

      /* Background pattern */
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background-image:
          linear-gradient(rgba(16, 24, 40, 0.018) 1px, transparent 1px),
          linear-gradient(90deg, rgba(16, 24, 40, 0.018) 1px, transparent 1px);
        background-size: 36px 36px;
        mask-image: linear-gradient(
          to bottom,
          rgba(0, 0, 0, 0.45),
          transparent 65%
        );
        z-index: -1;
      }

      /* Scrollbar Styling */
      ::-webkit-scrollbar {
        width: 7px;
        height: 7px;
      }
      ::-webkit-scrollbar-thumb {
        background: #cfd5e2;
        border-radius: 99px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #aeb7c8;
      }

      /* =========================================================
       SIDEBAR
    ========================================================= */
      .sidebar {
        width: 348px;
        min-width: 348px;
        height: 100%;
        display: flex;
        flex-direction: column;
        background: rgba(255, 255, 255, 0.92);
        backdrop-filter: blur(18px);
        border-right: 1px solid var(--line);
        box-shadow: 12px 0 35px rgba(16, 24, 40, 0.035);
        z-index: 10;
      }

      .sidebar-header {
        padding: 25px 24px 23px;
        background: linear-gradient(
          135deg,
          #111c3d 0%,
          #1b2d67 52%,
          #3157d5 100%
        );
        color: #fff;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        position: relative;
        overflow: hidden;
      }

      .sidebar-header::after {
        content: "GRAMMAR ACADEMY";
        display: block;
        margin-top: 7px;
        color: rgba(255, 255, 255, 0.72);
        font-size: 10px;
        letter-spacing: 0.24em;
      }

      .language-switcher {
        padding: 16px 18px;
        background: rgba(248, 250, 252, 0.82);
        border-bottom: 1px solid var(--line);
      }
      .language-switch {
        display: flex;
        padding: 3px;
        border: 1px solid var(--line);
        border-radius: 11px;
        background: #f3f5f9;
        gap: 4px;
      }
      .language-btn {
        flex: 1;
        padding: 9px 11px;
        color: var(--muted);
        font-size: 13px;
        font-weight: 500;
        border-radius: 8px;
        border: none;
        background: transparent;
        cursor: pointer;
        transition: 0.3s;
      }
      .language-btn:hover {
        color: var(--brand);
      }
      .language-btn.active {
        background: #fff;
        color: var(--brand);
        font-weight: 600;
        box-shadow: 0 2px 7px rgba(16, 24, 40, 0.08);
      }

      /* Cây thư mục */
      .tree-container {
        flex: 1;
        overflow-y: auto;
        padding: 18px 14px 30px;
      }
      .tree-container ul {
        list-style: none;
      }
      .tree-container .children-list {
        display: none;
        margin: 5px 0 2px 15px;
        padding-left: 10px;
        border-left: 1px solid #e3e7ef;
        animation: fadeIn 0.3s ease;
      }
      .tree-node.open > .children-list {
        display: block;
      }
      .tree-node {
        margin: 2px 0;
      }
      .node-content {
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .expand-btn {
        width: 27px;
        height: 27px;
        border-radius: 8px;
        border: none;
        background: transparent;
        color: #98a2b3;
        font-size: 11px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: 0.2s;
      }
      .expand-btn:hover {
        background: var(--brand-soft);
        color: var(--brand);
      }
      .expand-btn.no-children {
        color: #c8ced9;
        cursor: default;
      }
      .expand-icon {
        transition: transform 0.3s;
      }
      .tree-node.open > .node-content .expand-icon {
        transform: rotate(90deg);
      }
      .category-title {
        flex: 1;
        padding: 8px 10px;
        border: 1px solid transparent;
        border-radius: 9px;
        color: #475467;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        line-height: 1.35;
        transition: 0.2s;
      }
      .category-title:hover {
        background: #f5f7fb;
        color: var(--ink);
      }
      .category-title.active {
        background: var(--brand-soft);
        color: #2448bb;
        border-color: #dfe6ff;
        font-weight: 600;
        position: relative;
      }

      /* =========================================================
       MAIN CONTENT
    ========================================================= */
      .main-content {
        flex: 1;
        height: 100%;
        overflow-y: auto;
        padding: 38px clamp(24px, 4vw, 64px) 70px;
        display: flex;
        flex-direction: column;
        gap: 22px;
      }

      .card {
        background: rgba(255, 255, 255, 0.94);
        border: 1px solid rgba(217, 222, 234, 0.9);
        border-radius: var(--radius-xl);
        padding: clamp(25px, 3vw, 42px);
        box-shadow: var(--shadow-1);
        animation: slideUp 0.4s ease-out;
      }

      .main-content > .card:first-child {
        background: linear-gradient(135deg, #fff 0%, #fbfcff 60%, #f1f4ff 100%);
      }

      h1 {
        color: var(--ink);
        font-size: clamp(1.5rem, 3vw, 2rem);
        line-height: 1.2;
        margin-bottom: 12px;
        font-weight: 700;
      }
      .description {
        color: var(--muted);
        font-size: 15px;
        line-height: 1.6;
      }

      /* Breadcrumb */
      .breadcrumb {
        display: flex;
        align-items: center;
        flex-wrap: nowrap;
        overflow-x: auto;
        scrollbar-width: none;
        padding-bottom: 12px;
        margin-bottom: 24px;
        border-bottom: 1px solid var(--line);
        color: var(--muted);
        font-size: 12px;
        gap: 6px;
      }
      .breadcrumb::-webkit-scrollbar {
        display: none;
      }

      .breadcrumb-item {
        color: var(--muted);
        font-weight: 600;
        cursor: pointer;
        padding: 4px 8px;
        border-radius: 6px;
        white-space: nowrap;
        transition: 0.2s;
      }
      .breadcrumb-item:hover {
        background: #f4f6fb;
        color: var(--brand);
      }
      .breadcrumb-item.active {
        color: var(--brand);
        background: var(--brand-soft);
        cursor: default;
      }
      .breadcrumb-separator {
        color: #b7becb;
        font-size: 10px;
        user-select: none;
      }

      /* Theory */
      .theory-title {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 12px;
        margin-bottom: 20px;
      }
      .theory-badge {
        background: #f8f3e8;
        color: #9b6a18;
        border: 1px solid #ead9b6;
        border-radius: 999px;
        padding: 6px 12px;
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
      }
      .theory-content {
        background: #f8faff;
        border: 1px solid #e7ebf4;
        border-left: 4px solid var(--brand);
        border-radius: 12px;
        padding: 20px;
        color: var(--ink-2);
        font-size: 14px;
        line-height: 1.8;
        white-space: pre-line;
      }

      /* Quiz */
      .quiz-section {
        display: flex;
        flex-direction: column;
        gap: 20px;
      }
      .quiz-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid var(--line);
        padding-bottom: 15px;
      }
      .quiz-title {
        font-size: 1.1rem;
        font-weight: 700;
        color: var(--ink);
      }
      .quiz-count {
        background: var(--brand-soft);
        color: var(--brand);
        padding: 6px 12px;
        border-radius: 20px;
        font-size: 11px;
        font-weight: 600;
      }

      /* Exam Selector */
      .exam-selector {
        display: flex;
        align-items: center;
        gap: 8px;
        background: #f6f8fc;
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 6px;
      }
      .exam-nav-btn {
        background: #fff;
        color: var(--ink-2);
        border: 1px solid var(--line);
        padding: 8px 12px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 12px;
        font-weight: 600;
        white-space: nowrap;
        transition: 0.2s;
      }
      .exam-nav-btn:hover:not(:disabled) {
        color: var(--brand);
        border-color: #cbd6fa;
      }
      .exam-nav-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .exam-list {
        display: flex;
        gap: 6px;
        flex: 1;
        overflow-x: auto;
        scrollbar-width: none;
      }
      .exam-list::-webkit-scrollbar {
        display: none;
      }
      .exam-tab {
        padding: 8px 16px;
        background: transparent;
        border: none;
        border-radius: 8px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        white-space: nowrap;
        transition: 0.2s;
      }
      .exam-tab:hover {
        background: var(--brand-soft);
        color: var(--brand);
      }
      .exam-tab.active {
        background: #fff;
        color: var(--brand);
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
      }

      /* Questions */
      .question-box {
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 24px;
        background: #fff;
        transition: 0.3s;
      }
      .question-box:hover {
        box-shadow: var(--shadow-1);
        border-color: #d7ddeb;
      }
      .question-number {
        display: inline-block;
        background: #f2f4f7;
        color: var(--muted);
        border: 1px solid #e4e7ec;
        padding: 4px 10px;
        border-radius: 20px;
        font-size: 10px;
        font-weight: 600;
        margin-bottom: 12px;
      }
      .question-title {
        font-size: 15px;
        font-weight: 600;
        margin-bottom: 16px;
        line-height: 1.6;
      }
      .options-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .option-label {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 14px 16px;
        border: 1px solid #e1e5ec;
        border-radius: 10px;
        cursor: pointer;
        font-size: 14px;
        transition: 0.2s;
      }
      .option-label:hover {
        background: #fafbff;
        border-color: #b9c7f4;
      }
      .option-label input[type="radio"] {
        width: 18px;
        height: 18px;
        accent-color: var(--brand);
      }

      .submit-btn {
        margin-top: 20px;
        background: linear-gradient(135deg, #294bbd, #4167dc);
        color: #fff;
        border: none;
        padding: 12px 24px;
        border-radius: 10px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: 0.3s;
        box-shadow: 0 4px 12px rgba(49, 87, 213, 0.2);
      }
      .submit-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 16px rgba(49, 87, 213, 0.3);
      }

      .result-alert {
        margin-top: 16px;
        padding: 16px;
        border-radius: 10px;
        font-size: 14px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        animation: fadeIn 0.3s;
      }
      .correct-box {
        background: var(--success-soft);
        border: 1px solid #abefc6;
        color: #067647;
      }
      .incorrect-box {
        background: var(--danger-soft);
        border: 1px solid #fecdca;
        color: #b42318;
      }
      .empty-state {
        text-align: center;
        padding: 40px;
        color: var(--muted);
        border: 1px dashed #d8dee9;
        border-radius: 12px;
        font-size: 14px;
      }

      /* Animations */
      @keyframes slideUp {
        from {
          opacity: 0;
          transform: translateY(15px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      /* =========================================================
       RESPONSIVE
    ========================================================= */
      @media (max-width: 900px) {
        body {
          flex-direction: column;
        }
        .sidebar {
          width: 100%;
          min-width: 100%;
          height: 35vh; /* Chiếm 35% màn hình trên mobile */
          min-height: 250px;
          border-right: none;
          border-bottom: 1px solid var(--line);
        }
        .main-content {
          padding: 20px 16px;
        }
        .card {
          padding: 20px;
        }
        .quiz-header {
          flex-direction: column;
          align-items: flex-start;
          gap: 10px;
        }
        .exam-selector {
          flex-wrap: wrap;
        }
        .exam-nav-btn {
          flex: 1;
          text-align: center;
        }
        .exam-list {
          width: 100%;
          order: -1;
        } /* Đẩy danh sách bài lên trên nút Next/Prev */
      }
    </style>
  </head>
  <body>
    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="sidebar-header" id="sidebarHeader">NGỮ PHÁP TIẾNG ANH</div>
      <div class="language-switcher">
        <div class="language-switch">
          <button
            id="viBtn"
            class="language-btn active"
            onclick="setLanguage('vi')"
          >
            🇻🇳 Tiếng Việt
          </button>
          <button id="enBtn" class="language-btn" onclick="setLanguage('en')">
            🇬🇧 English
          </button>
        </div>
      </div>
      <div class="tree-container" id="treeRoot"></div>
    </aside>

    <!-- MAIN -->
    <main class="main-content" id="mainContent">
      <div class="card">
        <h1 id="welcomeTitle">Chào mừng bạn đến với hệ thống học Ngữ pháp!</h1>
        <p class="description" id="welcomeDescription">
          Chọn một chủ đề ở cột bên trái để bắt đầu xem lý thuyết và thử sức với
          các bài tập nhé. 🚀
        </p>
      </div>
    </main>

    <script>
      let currentLanguage = "vi";
      const languageIndex = { vi: 0, en: 1 };

      // DATA
      const grammarData = [
        {
          id: "english",

          name: ["Ngữ pháp Tiếng Anh", "English Grammar"],

          theory: [
            "Ngữ pháp tiếng Anh là nền tảng để xây dựng câu.",
            "English grammar is the foundation for building sentences.",
          ],

          exams: [],

          children: [
            {
              id: "parts-of-speech",
              name: ["1. Parts of Speech — TỪ", "1. Parts of Speech"],
              theory: [],
              exams: [],
              children: [
                {
                  id: "verb",
                  name: ["1. Verb — Động từ", "1. Verb"],
                  theory: [],
                  exams: [],
                  children: [
                    {
                      id: "tenses",
                      name: ["1. Tenses — Thì", "1. Tenses"],
                      theory: [],
                      exams: [],
                      children: [
                        {
                          id: "present",
                          name: ["1. Present — Hiện tại", "1. Present"],
                          theory: [],
                          exams: [],
                          children: [
                            {
                              id: "present-continuous",
                              name: [
                                "1. Present continuous — Hiện tại tiếp diễn",
                                "1. Present continuous",
                              ],
                              theory: [
                                "I am doing something = I started doing it and I haven’t finished; I’m in the middle of doing it. ",
                              ],
                              exams: [
                                {
                                  id: "pos-exam-1",

                                  name: ["Đề 1 - Cơ bản", "Exam 1 - Basic"],

                                  quizzes: [
                                    {
                                      id: "pc-adv-q1",
                                      question: [
                                        "The chef ___ the soup right now to see if it needs more salt.",
                                        "The chef ___ the soup right now to see if it needs more salt.",
                                      ],
                                      options: [
                                        "tastes",
                                        "is tasting",
                                        "taste",
                                        "are tasting",
                                      ],
                                      answer: 1,
                                      explanation: [
                                        "Động từ 'taste' thông thường là động từ trạng thái, nhưng khi mang nghĩa chủ động là 'đang nếm thử' thì được dùng ở thì hiện tại tiếp diễn.",
                                        "Normally a stative verb, 'taste' can be used in the continuous tense when it describes the active action of testing a flavor.",
                                      ],
                                    },
                                    {
                                      id: "pc-adv-q2",
                                      question: [
                                        "My roommate is so annoying! He ___ his dirty clothes on the floor.",
                                        "My roommate is so annoying! He ___ his dirty clothes on the floor.",
                                      ],
                                      options: [
                                        "always leaves",
                                        "is always leaving",
                                        "always leave",
                                        "are always leaving",
                                      ],
                                      answer: 1,
                                      explanation: [
                                        "Khi muốn phàn nàn về một thói quen xấu, lặp đi lặp lại gây khó chịu, ta dùng 'always' + hiện tại tiếp diễn.",
                                        "To complain about a repetitive, annoying habit, we use 'always' + present continuous.",
                                      ],
                                    },
                                    {
                                      id: "pc-adv-q3",
                                      question: [
                                        "Look at that beautiful sports car! Who ___ to?",
                                        "Look at that beautiful sports car! Who ___ to?",
                                      ],
                                      options: [
                                        "does it belong",
                                        "is it belonging",
                                        "do it belong",
                                        "does it belonging",
                                      ],
                                      answer: 0,
                                      explanation: [
                                        "Dù có từ 'Look' (dấu hiệu của HTTD), nhưng động từ chỉ sự sở hữu 'belong' (thuộc về) là động từ trạng thái, KHÔNG BAO GIỜ chia ở thì tiếp diễn.",
                                        "Despite the word 'Look', the verb of possession 'belong' is a stative verb and is NEVER used in continuous tenses.",
                                      ],
                                    },
                                    {
                                      id: "pc-adv-q4",
                                      question: [
                                        "Normally, I work in the New York office, but I ___ in the London office this month.",
                                        "Normally, I work in the New York office, but I ___ in the London office this month.",
                                      ],
                                      options: [
                                        "work",
                                        "am working",
                                        "works",
                                        "working",
                                      ],
                                      answer: 1,
                                      explanation: [
                                        "Hành động làm việc ở New York là cố định (hiện tại đơn), nhưng việc làm ở London chỉ mang tính chất tạm thời (trong tháng này) nên dùng hiện tại tiếp diễn.",
                                        "Working in NY is permanent (present simple), but working in London is a temporary situation (this month), requiring the present continuous.",
                                      ],
                                    },
                                    {
                                      id: "pc-adv-q5",
                                      question: [
                                        "She ___ the dentist tomorrow morning because her toothache is getting worse.",
                                        "She ___ the dentist tomorrow morning because her toothache is getting worse.",
                                      ],
                                      options: [
                                        "sees",
                                        "is seeing",
                                        "see",
                                        "are seeing",
                                      ],
                                      answer: 1,
                                      explanation: [
                                        "'See' mang nghĩa 'có lịch hẹn gặp' (bác sĩ, nha sĩ) là một hành động đã được lên kế hoạch từ trước, dùng hiện tại tiếp diễn cho tương lai.",
                                        "When 'see' means 'having an appointment with' (a doctor/dentist), it expresses a pre-arranged future plan, using the present continuous.",
                                      ],
                                    },
                                    {
                                      id: "pc-adv-q6",
                                      question: [
                                        "Due to global warming, the Earth's climate ___ rapidly.",
                                        "Due to global warming, the Earth's climate ___ rapidly.",
                                      ],
                                      options: [
                                        "changes",
                                        "is changing",
                                        "change",
                                        "are changing",
                                      ],
                                      answer: 1,
                                      explanation: [
                                        "Thì hiện tại tiếp diễn được dùng để diễn tả một tình huống đang dần dần thay đổi hoặc phát triển.",
                                        "The present continuous is used to describe a situation that is gradually changing or developing.",
                                      ],
                                    },
                                    {
                                      id: "pc-adv-q7",
                                      question: [
                                        "I ___ about looking for a new job because my current boss is very demanding.",
                                        "I ___ about looking for a new job because my current boss is very demanding.",
                                      ],
                                      options: [
                                        "think",
                                        "am thinking",
                                        "thinks",
                                        "thinking",
                                      ],

        if (Array.isArray(value)) {
          const index = languageIndex[currentLanguage];
          return value[index] ?? value[0] ?? "";
        }
        return value ?? "";
      }

        document.getElementById("sidebarHeader").textContent = t("header");
      }

      function setLanguage(language) {
        if (!languageIndex.hasOwnProperty(language)) return;
        currentLanguage = language;
        document.documentElement.lang = language;

        renderStaticUI();
        updateLanguageButtons();
        renderTree();

        if (activeNodeId) {
          const node = findNodeById(grammarData, activeNodeId);
          if (node) renderNodeContent(node);
        } else {
          renderWelcome();
        }
      }

      function t(key) {
        return uiText[currentLanguage][key];
      }

      function findNodeById(nodes, id) {
        for (const node of nodes) {
          if (node.id === id) return node;
          if (Array.isArray(node.children)) {
            const found = findNodeById(node.children, id);
            if (found) return found;
          }
        }
        return null;
      }

      function findNodePath(nodes, id, path = []) {
        for (const node of nodes) {
          const currentPath = [...path, node];
          if (node.id === id) return currentPath;
          if (node.children?.length) {
            const result = findNodePath(node.children, id, currentPath);
            if (result) return result;
          }
        }
        return null;
      }

      function findQuizById(nodes, quizId) {
        for (const node of nodes) {
          if (Array.isArray(node.exams)) {
            for (const exam of node.exams) {
              if (!Array.isArray(exam.quizzes)) continue;
              const quiz = exam.quizzes.find((item) => item.id === quizId);
              if (quiz) return quiz;
            }
          }
          if (Array.isArray(node.children)) {
            const found = findQuizById(node.children, quizId);
            if (found) return found;
          }
        }
        return null;
      }

      function renderTree() {
        const treeRoot = document.getElementById("treeRoot");
        treeRoot.innerHTML = renderNodeList(grammarData);
      }

      function renderNodeList(nodes) {
        if (!nodes?.length) return "";
        return `<ul>${nodes.map((node) => renderNode(node)).join("")}</ul>`;
      }

      function renderNode(node) {
        const hasChildren =
          Array.isArray(node.children) && node.children.length > 0;
        return `
        <li class="tree-node" data-node-id="${node.id}">
          <div class="node-content">
            ${
              hasChildren
                ? `<button class="expand-btn" onclick="toggleNode(event, '${node.id}')"><span class="expand-icon">❯</span></button>`
                : `<button class="expand-btn no-children" disabled>•</button>`
            }
            <div class="category-title ${node.id === activeNodeId ? "active" : ""}" 
                 data-node-id="${node.id}" onclick="selectNode('${node.id}')">
              ${escapeHtml(getText(node.name))}
            </div>
          </div>
          ${hasChildren ? `<div class="children-list">${renderNodeList(node.children)}</div>` : ""}
        </li>
      `;
      }

      function toggleNode(event, nodeId) {
        event.stopPropagation();
        const node = document.querySelector(
          `.tree-node[data-node-id="${nodeId}"]`,
        );
        if (node) node.classList.toggle("open");
      }

      function selectNode(nodeId) {
        const node = findNodeById(grammarData, nodeId);
        if (!node) return;

        activeNodeId = nodeId;
        activeExamId = null;

        document
          .querySelectorAll(".category-title")
          .forEach((el) => el.classList.remove("active"));
        const activeElement = document.querySelector(
          `.category-title[data-node-id="${nodeId}"]`,
        );
        if (activeElement) activeElement.classList.add("active");

        if (node.children?.length) {
          const treeNode = document.querySelector(
            `.tree-node[data-node-id="${nodeId}"]`,
          );
          if (treeNode) treeNode.classList.add("open");
        }

        renderNodeContent(node);
      }

      function handleBreadcrumbClick(nodeId) {
        selectNode(nodeId);
        const parentNode = document.querySelector(
          `.tree-node[data-node-id="${nodeId}"]`,
        );
        if (parentNode) {
          const childNodes = parentNode.querySelectorAll(".tree-node");
          childNodes.forEach((child) => child.classList.remove("open"));
        }
      }

      function renderWelcome() {
        const mainContent = document.getElementById("mainContent");
        mainContent.innerHTML = `
        <div class="card">
          <h1>${escapeHtml(t("welcomeTitle"))}</h1>
          <p class="description">${escapeHtml(t("welcomeDescription"))}</p>
        </div>
      `;
      }

      function renderNodeContent(node) {
        const mainContent = document.getElementById("mainContent");
        const path = findNodePath(grammarData, node.id) || [];
        const breadcrumbHtml = path
          .map((item, index) => {
            const isLast = index === path.length - 1;
            const className = isLast
              ? "breadcrumb-item active"
              : "breadcrumb-item";
            const clickAction = isLast
              ? ""
              : `onclick="handleBreadcrumbClick('${item.id}')"`;
            return `<span class="${className}" ${clickAction}>${escapeHtml(getText(item.name))}</span>`;
          })
          .join('<span class="breadcrumb-separator"> ❯ </span>');

        const exams = Array.isArray(node.exams) ? node.exams : [];
        if (exams.length > 0) {
          if (!exams.some((exam) => exam.id === activeExamId)) {
            activeExamId = exams[0].id;
          }
        } else {
          activeExamId = null;
        }

        mainContent.innerHTML = `
        <div class="card">
          <div class="breadcrumb">📍 ${breadcrumbHtml}</div>
          <div class="theory-title">
            <h1>${escapeHtml(getText(node.name))}</h1>
            <span class="theory-badge">📚 ${t("theory")}</span>
          </div>
          ${
            node.theory && node.theory.length > 0
              ? `<div class="theory-content">${escapeHtml(getText(node.theory))}</div>`
              : `<div class="empty-state">${t("noTheory")}</div>`
          }
        </div>

        <div class="card quiz-section">
          <div class="quiz-header">
            <div class="quiz-title">${t("examPractice")}</div>
            <div class="quiz-count">${exams.length} ${t("examCount")}</div>
          </div>
          ${renderExamSelector(exams)}
          ${renderActiveExam(exams)}
        </div>
      `;
      }

      function renderExamSelector(exams) {
        if (!Array.isArray(exams) || exams.length === 0) {
          return `<div class="empty-state">${t("noExam")}</div>`;
        }
        const activeIndex = exams.findIndex((exam) => exam.id === activeExamId);

        return `
        <div class="exam-selector">
          <button class="exam-nav-btn" onclick="changeExam(-1)" ${activeIndex <= 0 ? "disabled" : ""}>
            ${t("previousExam")}
          </button>
          <div class="exam-list">
            ${exams
              .map(
                (exam, index) => `
              <button class="exam-tab ${exam.id === activeExamId ? "active" : ""}" 
                      onclick="selectExam('${exam.id}')">
                ${escapeHtml(getText(exam.name) || `${currentLanguage === "vi" ? "Đề" : "Exam"} ${index + 1}`)}
              </button>
            `,
              )
              .join("")}
          </div>
          <button class="exam-nav-btn" onclick="changeExam(1)" ${activeIndex >= exams.length - 1 ? "disabled" : ""}>
            ${t("nextExam")}
          </button>
        </div>
      `;
      }

      function renderActiveExam(exams) {
        if (!Array.isArray(exams) || exams.length === 0) return "";
        const exam = exams.find((item) => item.id === activeExamId);
        if (!exam) return "";
        const quizzes = Array.isArray(exam.quizzes) ? exam.quizzes : [];

        return `
        <div class="quiz-header" style="border: none; padding-top: 10px;">
          <div class="quiz-title" style="color: var(--brand);">📝 ${escapeHtml(getText(exam.name))}</div>
          <div class="quiz-count" style="background: var(--brand-soft);">${quizzes.length} ${t("questionCount")}</div>
        </div>
        ${renderQuizzes(quizzes)}
      `;
      }

      function selectExam(examId) {
        const node = findNodeById(grammarData, activeNodeId);
        if (!node || !Array.isArray(node.exams)) return;
        activeExamId = examId;
        renderNodeContent(node);
      }

      function changeExam(direction) {
        const node = findNodeById(grammarData, activeNodeId);
        if (!node || !Array.isArray(node.exams)) return;
        const currentIndex = node.exams.findIndex(
          (exam) => exam.id === activeExamId,
        );
        if (currentIndex === -1) {
          activeExamId = node.exams[0]?.id || null;
          renderNodeContent(node);
          return;
        }
        const nextIndex = currentIndex + direction;
        if (nextIndex < 0 || nextIndex >= node.exams.length) return;
        activeExamId = node.exams[nextIndex].id;
        renderNodeContent(node);
      }

      function renderQuizzes(quizzes) {
        if (!Array.isArray(quizzes) || quizzes.length === 0) {
          return `<div class="empty-state">${t("noQuestion")}</div>`;
        }

        return quizzes
          .map(
            (quiz, index) => `
        <div class="question-box" id="quiz-${escapeHtml(quiz.id)}">
          <div class="question-number">${t("question")} ${index + 1}</div>
          <div class="question-title">${escapeHtml(getText(quiz.question))}</div>
          <div class="options-list">
            ${quiz.options
              .map(
                (option, optionIndex) => `
              <label class="option-label">
                <input type="radio" name="quiz-${quiz.id}" value="${optionIndex}">
                <span>${escapeHtml(option)}</span>
              </label>
            `,
              )
              .join("")}
          </div>
          <button class="submit-btn" onclick="checkAnswer('${quiz.id}')">${t("check")}</button>
          <div id="result-${quiz.id}"></div>
        </div>
      `,
          )
          .join("");
      }

      function checkAnswer(quizId) {
        const quiz = findQuizById(grammarData, quizId);
        if (!quiz) return;
        const selected = document.querySelector(
          `input[name="quiz-${quizId}"]:checked`,
        );
        const resultMsg = document.getElementById(`result-${quizId}`);

        if (!selected) {
          resultMsg.innerHTML = `<div class="result-alert incorrect-box"><strong>${t("chooseAnswer")}</strong></div>`;
          return;
        }

        const userChoice = Number(selected.value);
        if (userChoice === quiz.answer) {
          resultMsg.innerHTML = `
          <div class="result-alert correct-box">
            <strong>${t("correct")}</strong>
            <span class="expl"><strong>${t("explanation")}</strong> ${escapeHtml(getText(quiz.explanation))}</span>
          </div>
        `;
        } else {
          resultMsg.innerHTML = `
          <div class="result-alert incorrect-box">
            <strong>${t("incorrect")}</strong>
            <span class="expl"><strong>${t("explanation")}</strong> ${escapeHtml(getText(quiz.explanation))}</span>
          </div>
        `;
        }
      }

      function escapeHtml(value) {
        if (value === undefined || value === null) return "";
        return String(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      renderStaticUI();
      updateLanguageButtons();
      renderTree();
    </script>
  </body>
</html>
